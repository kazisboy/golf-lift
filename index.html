var currentDay = 0;
var currentWeek = 0;
var currentTab = "workout";
var currentProgDay = 0;
var openEx = null;

function lsKey(w, d, e) { return "gl:w" + w + ":" + d + ":" + e; }
function doneKey(w, d) { return "gl:done:w" + w + ":" + d; }
function noteKey(w, d, e) { return "gl:note:w" + w + ":" + d + ":" + e; }

function getLog(d, e) {
  try { return JSON.parse(localStorage.getItem(lsKey(currentWeek, d, e)) || "{}"); } catch(err) { return {}; }
}
function saveLog(d, e, v) {
  try { localStorage.setItem(lsKey(currentWeek, d, e), JSON.stringify(v)); } catch(err) {}
}
function isDone(d) { return localStorage.getItem(doneKey(currentWeek, d)) === "1"; }
function toggleDone(d) {
  var k = doneKey(currentWeek, d);
  if (localStorage.getItem(k) === "1") { localStorage.removeItem(k); } else { localStorage.setItem(k, "1"); }
}
function getNote(d, e) { return localStorage.getItem(noteKey(currentWeek, d, e)) || ""; }
function saveNote(d, e, v) {
  if (v) { localStorage.setItem(noteKey(currentWeek, d, e), v); } else { localStorage.removeItem(noteKey(currentWeek, d, e)); }
}
function getProg(d, e) {
  var out = [];
  for (var w = -4; w <= 8; w++) {
    try {
      var raw = localStorage.getItem(lsKey(w, d, e));
      if (raw) { var p = JSON.parse(raw); if (p.weight) { out.push({ w: w, v: parseFloat(p.weight) }); } }
    } catch(err) {}
  }
  return out;
}
function weekLabel() {
  if (currentWeek === 0) return "THIS WEEK";
  if (currentWeek > 0) return "WEEK +" + currentWeek;
  return "WEEK " + currentWeek;
}

function switchTab(tab) {
  currentTab = tab;

  document.getElementById("bnav-progress").className = "bnav-btn" + (tab === "progress" ? " active" : "");
  renderMain();
}

function renderAll() {
  renderDots();
  renderWeekNav();
  renderDayNav();
  renderMain();
}

function renderDots() {
  var d = DAYS[currentDay];
  document.getElementById("accent-title").style.color = d.ac;
  var html = "";
  for (var i = 0; i < DAYS.length; i++) {
    var dn = isDone(DAYS[i].id);
    var style = dn ? "background:" + DAYS[i].ac + ";border-color:" + DAYS[i].ac + ";color:#000;" : "";
    html += '<div class="wdot' + (dn ? " done" : "") + '" style="' + style + '">' + DAYS[i].day[0] + '</div>';
  }
  document.getElementById("week-dots").innerHTML = html;
}

function renderWeekNav() {
  document.getElementById("wk-lbl").textContent = weekLabel();
}

function renderDayNav() {
  var d = DAYS[currentDay];
  var html = "";
  for (var i = 0; i < DAYS.length; i++) {
    var act = currentDay === i;
    var style = act ? "background:" + DAYS[i].ac + ";border-color:" + DAYS[i].ac + ";color:#000;" : "";
    html += '<button class="daybtn' + (act ? " active" : "") + '" style="' + style + '" onclick="selectDay(' + i + ')">' + DAYS[i].day + '</button>';
  }
  document.getElementById("daynav").innerHTML = html;
}

function selectDay(i) {
  currentDay = i;
  openEx = null;
  renderAll();
  window.scrollTo(0, 0);
}

function renderMain() {
  if (currentTab === "workout") { renderWorkout(); } else { renderProgress(); }
}
