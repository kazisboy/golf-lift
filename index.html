<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GolfLift"/>
<meta name="theme-color" content="#0f0f0f"/>
<link rel="manifest" href="./manifest.json"/>
<title>Golf Lift Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
–bg: #0f0f0f;
–surface: #1a1a1a;
–surface2: #222;
–border: #2a2a2a;
–text: #f0ede6;
–muted: #888;
–faint: #444;
–safe-top: env(safe-area-inset-top, 0px);
–safe-bot: env(safe-area-inset-bottom, 0px);
}

html, body { height: 100%; background: var(–bg); color: var(–text); font-family: ‘DM Sans’, sans-serif; overflow: hidden; }

/* ── LAYOUT ── */
#app { display: flex; flex-direction: column; height: 100%; }
#header { flex-shrink: 0; }
#scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(80px + var(–safe-bot)); }
#bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: var(–safe-bot); background: #111; border-top: 1px solid var(–border); z-index: 100; }

/* ── HEADER ── */
.header-wrap {
padding: calc(var(–safe-top) + 20px) 20px 0;
background: var(–bg);
border-bottom: 1px solid var(–border);
}
.header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.header-eyebrow { font-size: 9px; letter-spacing: .35em; color: var(–muted); text-transform: uppercase; margin-bottom: 6px; }
.header-title { font-family: ‘Playfair Display’, serif; font-size: 32px; font-weight: 900; font-style: italic; line-height: 1; color: var(–text); }
.header-title span { transition: color .4s; }
.week-dots { display: flex; gap: 6px; align-items: center; }
.week-dot { width: 26px; height: 26px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; letter-spacing: .05em; border: 1.5px solid var(–border); color: var(–faint); background: var(–surface); transition: all .3s; }
.week-dot.done { color: #000; }

/* ── DAY NAV ── */
.day-nav { display: flex; overflow-x: auto; scrollbar-width: none; padding: 0 20px; gap: 4px; }
.day-nav::-webkit-scrollbar { display: none; }
.day-btn {
flex-shrink: 0; background: none; border: none; border-bottom: 3px solid transparent;
color: var(–muted); padding: 14px 14px 11px; cursor: pointer;
font-family: ‘DM Sans’, sans-serif; transition: all .2s; position: relative;
}
.day-btn.active { color: var(–accent-color); border-bottom-color: var(–accent-color); }
.day-btn-label { font-size: 12px; font-weight: 700; letter-spacing: .12em; display: block; }
.day-btn-tag { font-size: 8px; letter-spacing: .15em; margin-top: 2px; display: block; opacity: .8; }
.day-done-dot { position: absolute; top: 10px; right: 8px; width: 6px; height: 6px; border-radius: 50%; }

/* ── CONTENT CARDS ── */
.content-pad { padding: 16px 16px 0; }
.card {
background: var(–surface); border-radius: 14px; border: 1px solid var(–border);
margin-bottom: 12px; overflow: hidden;
}
.card-header { padding: 18px 18px 16px; }
.card-eyebrow { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
.card-title { font-family: ‘Playfair Display’, serif; font-size: 22px; font-weight: 700; font-style: italic; color: var(–text); }
.card-body { font-size: 13px; color: var(–muted); line-height: 1.7; margin-top: 10px; }

.warmup-box { margin: 14px 0 0; padding: 12px 14px; background: var(–bg); border-radius: 9px; border-left: 3px solid var(–faint); }
.warmup-label { font-size: 9px; letter-spacing: .25em; color: var(–faint); text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
.warmup-text { font-size: 12px; color: #777; line-height: 1.6; }

.done-btn {
margin-top: 14px; padding: 10px 18px; border-radius: 8px; border: 1.5px solid var(–faint);
background: transparent; color: var(–muted); font-family: ‘DM Sans’, sans-serif;
font-size: 12px; font-weight: 700; letter-spacing: .12em; cursor: pointer; transition: all .25s;
width: 100%;
}
.done-btn.completed { color: #000; border-color: transparent; }

/* ── EXERCISE CARDS ── */
.ex-card { background: var(–surface); border-radius: 12px; border: 1px solid var(–border); margin-bottom: 8px; overflow: hidden; transition: border-color .25s; }
.ex-card.open { border-color: var(–accent-border); }
.ex-row { display: flex; align-items: center; gap: 12px; padding: 15px 16px; cursor: pointer; }
.ex-num { width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; flex-shrink: 0; }
.ex-info { flex: 1; min-width: 0; }
.ex-name { font-weight: 600; font-size: 14px; color: var(–text); }
.ex-meta { display: flex; gap: 10px; margin-top: 3px; flex-wrap: wrap; }
.ex-sets { font-size: 11px; color: var(–muted); }
.ex-logged { font-size: 11px; font-weight: 700; }
.ex-arrow { font-size: 18px; color: var(–faint); transition: transform .25s; flex-shrink: 0; }
.ex-arrow.open { transform: rotate(90deg); }

/* ── EXPANDED LOG ── */
.ex-body { border-top: 1px solid var(–border); padding: 16px; background: #151515; }
.cue-box { padding: 12px 14px; background: var(–surface); border-radius: 9px; margin-bottom: 14px; }
.cue-label { font-size: 9px; letter-spacing: .25em; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
.cue-text { font-size: 13px; color: #888; line-height: 1.65; }

.log-label { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(–muted); font-weight: 600; margin-bottom: 8px; }
.log-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.log-field label { font-size: 10px; color: var(–faint); letter-spacing: .15em; text-transform: uppercase; display: block; margin-bottom: 4px; }
.log-field input {
width: 100%; padding: 10px 12px; border: 1.5px solid var(–border); border-radius: 8px;
background: var(–bg); color: var(–text); font-family: ‘DM Sans’, sans-serif;
font-size: 16px; outline: none; transition: border-color .2s; -webkit-appearance: none;
}
.log-field input:focus { border-color: var(–accent-color); }
.notes-field textarea {
width: 100%; padding: 10px 12px; border: 1.5px solid var(–border); border-radius: 8px;
background: var(–bg); color: var(–text); font-family: ‘DM Sans’, sans-serif;
font-size: 14px; outline: none; resize: none; line-height: 1.5; transition: border-color .2s;
-webkit-appearance: none;
}
.notes-field textarea:focus { border-color: var(–accent-color); }

/* ── FINISHER ── */
.finisher-card { border-radius: 12px; border: 1.5px solid; padding: 16px 18px; margin: 4px 0 12px; }
.finisher-label { font-size: 9px; letter-spacing: .3em; text-transform: uppercase; font-weight: 900; margin-bottom: 8px; }
.finisher-text { font-size: 14px; font-style: italic; line-height: 1.6; color: #ccc; }

/* ── PROGRESS TAB ── */
.prog-day-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 16px; scrollbar-width: none; }
.prog-day-scroll::-webkit-scrollbar { display: none; }
.prog-day-btn {
flex-shrink: 0; padding: 8px 14px; border-radius: 20px; border: 1.5px solid var(–border);
background: var(–surface); color: var(–muted); font-family: ‘DM Sans’, sans-serif;
font-size: 11px; font-weight: 700; letter-spacing: .1em; cursor: pointer; transition: all .2s;
}
.prog-day-btn.active { color: #000; border-color: transparent; }

.prog-card { background: var(–surface); border-radius: 12px; border: 1px solid var(–border); padding: 18px; margin-bottom: 10px; }
.prog-name { font-weight: 700; font-size: 15px; color: var(–text); }
.prog-sub { font-size: 11px; color: var(–muted); margin-top: 3px; }
.prog-pr { font-size: 22px; font-weight: 900; margin-top: 8px; }
.prog-pr-label { font-size: 9px; letter-spacing: .15em; color: var(–muted); }
.prog-bars { display: flex; align-items: flex-end; gap: 6px; height: 70px; margin-top: 14px; }
.prog-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.prog-bar-val { font-size: 8px; color: var(–muted); }
.prog-bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 4px; transition: height .4s ease; }
.prog-bar-week { font-size: 8px; color: var(–faint); }
.prog-empty { padding: 20px; text-align: center; font-size: 13px; color: var(–faint); font-style: italic; background: var(–bg); border-radius: 8px; }

/* ── WEEK NAV ── */
.week-nav { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 20px 14px; }
.week-nav-btn { background: none; border: 1px solid var(–border); color: var(–muted); border-radius: 6px; width: 32px; height: 32px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.week-nav-label { font-size: 12px; color: var(–muted); letter-spacing: .15em; min-width: 90px; text-align: center; }

/* ── BOTTOM NAV ── */
.bnav { display: flex; }
.bnav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 0; background: none; border: none; cursor: pointer; font-family: ‘DM Sans’, sans-serif; color: var(–muted); transition: color .2s; }
.bnav-btn.active { color: var(–text); }
.bnav-icon { font-size: 22px; }
.bnav-label { font-size: 9px; letter-spacing: .15em; text-transform: uppercase; font-weight: 600; }

/* ── INSTALL BANNER ── */
#install-banner { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 999; background: #1a1a1a; border-bottom: 1px solid #2a2a2a; padding: calc(var(–safe-top) + 14px) 16px 14px; }
.install-inner { display: flex; align-items: center; gap: 12px; }
.install-icon { font-size: 28px; flex-shrink: 0; }
.install-text { flex: 1; font-size: 13px; color: var(–text); line-height: 1.5; }
.install-text strong { color: #4ade80; }
.install-close { background: none; border: none; color: var(–muted); font-size: 22px; cursor: pointer; flex-shrink: 0; }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.fade-up { animation: fadeUp .3s ease forwards; }

/* ── SCROLLBAR ── */
#scroll-area::-webkit-scrollbar { width: 0; }
</style>

</head>
<body>

<div id="install-banner">
  <div class="install-inner">
    <div class="install-icon">⛳</div>
    <div class="install-text">
      <strong>Add to Home Screen</strong><br>
      Tap <strong>Share</strong> → <strong>Add to Home Screen</strong> for the full app experience
    </div>
    <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">×</button>
  </div>
</div>

<div id="app">
  <div id="header"></div>
  <div id="scroll-area"></div>
  <div id="bottom-nav"></div>
</div>

<script>
// ── PROGRAM DATA ─────────────────────────────────────────────────────────────
const PROGRAM = [
  {
    id:'mon', day:'MON', label:'Lower Power', tag:'EXPLOSIVENESS', accent:'#4ade80',
    focus:'Hip drive & posterior chain power — the engine of every golf swing. Every yard starts from the ground up.',
    warmup:'10 min: glute bridges ×20, leg swings, hip 90/90 mobility, band clamshells ×15 each, hip circle activation',
    exercises:[
      {id:'trap-dl', name:'Trap Bar Deadlift', sets:5, reps:'3', load:'90% 1RM', note:'Explosive concentric. Full hip lockout at top. This is your ground-force king — trains the same vertical force you drive into the turf at impact.'},
      {id:'box-jump', name:'Box Jump (Seated Start)', sets:5, reps:'4', load:'Bodyweight', note:'Start seated on a box or bench, stand and EXPLODE immediately. Trains reactive hip power. Max height every rep. Step down — never jump down.'},
      {id:'bulgarian', name:'Bulgarian Split Squat', sets:4, reps:'6 ea', load:'Heavy DB or BB', note:'Back foot elevated. Drive through front heel. Unilateral leg power is critical for weight shift and stability through the golf swing.'},
      {id:'rdl', name:'Romanian Deadlift', sets:4, reps:'8', load:'70–75% 1RM', note:'Slow 3-second eccentric. Load the hamstrings for posterior chain hypertrophy. Feel the stretch — that\'s the power loading.'},
      {id:'hip-thrust', name:'Barbell Hip Thrust', sets:4, reps:'10', load:'Moderate–Heavy', note:'Full glute lockout at top. 2s pause. Glute power directly = swing speed — this is non-negotiable.'},
      {id:'nordic', name:'Nordic Hamstring Curl', sets:3, reps:'6', load:'Bodyweight', note:'Eccentric only. Lower as slow as humanly possible. Partner anchors feet. The single best hamstring exercise — injury prevention gold.'},
      {id:'calf', name:'Single-Leg Calf Raise', sets:3, reps:'15 ea', load:'Moderate', note:'Full ROM. Pause at top 1s. Ankle stability directly impacts your swing base — don\'t skip these.'},
    ],
    finisher:'3 × 6 broad jumps — max distance each rep, full reset between. Drive through the hips.',
  },
  {
    id:'tue', day:'TUE', label:'Upper Push + Core', tag:'STRENGTH', accent:'#60a5fa',
    focus:'Pressing strength and anti-rotation core — the transfer of hip power through the torso to the club.',
    warmup:'Band pull-aparts ×20, shoulder CARs, thoracic rotations, face pulls ×15, serratus wall slides ×10',
    exercises:[
      {id:'bench', name:'Barbell Bench Press', sets:5, reps:'5', load:'80–85% 1RM', note:'Scapular retraction, leg drive, controlled descent. Raw pressing strength underpins the arm force you generate through the ball.'},
      {id:'incline-db', name:'Incline DB Press', sets:4, reps:'8–10', load:'Moderate', note:'30–45° incline. Full stretch at bottom. This is chest hypertrophy work — build the muscle, then express it.'},
      {id:'push-press', name:'Push Press', sets:4, reps:'5', load:'Heavy', note:'Dip-drive-press. Develops the shoulder-to-arm power chain mirrored in the through-swing arm extension.'},
      {id:'landmine-press', name:'Landmine Single-Arm Press', sets:3, reps:'10 ea', load:'Moderate', note:'Rotational pressing pattern — directly mimics the through-swing arm path. Most golf-specific pressing exercise that exists.'},
      {id:'pallof', name:'Pallof Press (Tall Kneeling)', sets:4, reps:'12 ea', load:'Cable — moderate', note:'Anti-rotation. Kneeling eliminates the lower body — pure core stability. Hold 2 seconds at full extension. This is what keeps your spine angle.'},
      {id:'ab-wheel', name:'Ab Wheel Rollout', sets:4, reps:'10–12', load:'Bodyweight', note:'Full extension. The best golf core exercise — pure anti-extension strength that protects the lower back through every swing.'},
      {id:'woodchop', name:'Cable Woodchop (High to Low)', sets:4, reps:'12 ea', load:'Moderate', note:'Mirrors the downswing movement pattern exactly. Control the eccentric return. Feel your obliques.'},
    ],
    finisher:'3 × 10 med ball chest passes against wall — max snap each rep. Full arm extension.',
  },
  {
    id:'wed', day:'WED', label:'Rotational Power', tag:'SWING SPEED', accent:'#f59e0b',
    focus:'The most golf-specific training day of the week. Rotational force production is the #1 driver of clubhead speed.',
    warmup:'15 min: thoracic rotation drills, hip 90/90, half-kneeling hip flexor stretch, band pull-throughs ×15',
    exercises:[
      {id:'mb-slam', name:'Med Ball Rotational Slam', sets:5, reps:'6 ea', load:'10–15 lb ball', note:'Load into trail hip, EXPLODE through rotation, slam diagonally into wall or floor. This IS the golf swing — learn to feel the sequence.'},
      {id:'mb-scoop', name:'Med Ball Scoop Toss (Side)', sets:4, reps:'6 ea', load:'12–15 lb ball', note:'Hip hinge start. Explode up through the hip. Trains hip-to-core power sequencing — exactly how distance is generated.'},
      {id:'landmine-rot', name:'Landmine Rotational Press', sets:4, reps:'8 ea', load:'Moderate', note:'Rotate from hips first, THEN press. Sequencing is the entire exercise — exactly like a golf swing. Don\'t arm it.'},
      {id:'low-hi-chop', name:'Cable Chop (Low to High)', sets:4, reps:'10 ea', load:'Light–moderate', note:'Upswing pattern. Fast concentric, controlled return. Build the X-factor stretch — the rotational gap between hips and shoulders.'},
      {id:'sl-rdl', name:'Single-Leg RDL (KB)', sets:3, reps:'10 ea', load:'Moderate KB', note:'Single leg hip hinge — builds trail-leg stability and proprioception used through impact. Wobble is okay. Fight it.'},
      {id:'copenhagen', name:'Copenhagen Plank', sets:3, reps:'25s ea', load:'Bodyweight', note:'Adductor and hip strength for lateral stability. Prevents the deadly sway in your backswing.'},
      {id:'sled', name:'Sled Push', sets:4, reps:'20 yds', load:'Heavy', note:'Hip extension power. Short, powerful strides. Conditions the posterior chain and builds the drive force you push into the ground.'},
    ],
    finisher:'5 × 5 med ball wall shots (rotational) each side — absolute maximum effort. Every rep.',
  },
  {
    id:'thu', day:'THU', label:'Upper Pull + Grip', tag:'MUSCLE', accent:'#e879f9',
    focus:'Back thickness, lat strength, and crushing grip — the forgotten keys to distance and clubface control.',
    warmup:'Dead hang 30s, scapular pull-ups ×10, band dislocates ×10, face pulls ×20',
    exercises:[
      {id:'weighted-pu', name:'Weighted Pull-Up', sets:5, reps:'5', load:'Belt + heavy plate', note:'Dead hang start. Chest to bar. Lat strength stabilizes the club and controls the swing arc — essential for consistency at high speed.'},
      {id:'pendlay', name:'Pendlay Row', sets:4, reps:'6', load:'Heavy', note:'Bar starts on floor each rep. Explosive pull. Builds mid-back power that controls your impact position and late release.'},
      {id:'cable-row', name:'Seated Cable Row (Wide Grip)', sets:4, reps:'10', load:'Moderate–heavy', note:'Scapular retraction. Full stretch at front. Chest tall. Don\'t let the shoulders round forward at the catch.'},
      {id:'face-pull', name:'Face Pull', sets:4, reps:'20', load:'Light–moderate', note:'External rotation at end range. This is shoulder armor — the most important injury-prevention exercise for any golfer. Never skip it.'},
      {id:'curl', name:'Incline DB Curl', sets:3, reps:'10–12', load:'Moderate', note:'Seated on incline. Full stretch at bottom. Bicep strength for club control through impact — often overlooked.'},
      {id:'plate-pinch', name:'Plate Pinch Carry', sets:4, reps:'30 yds', load:'2 plates pinched ea hand', note:'Grip destruction. Forearm and grip strength = clubface control at maximum swing speed. This is what separates straight from crooked at high speeds.'},
      {id:'rev-curl', name:'Reverse Curl (EZ Bar)', sets:3, reps:'12', load:'Light', note:'Overhand grip. Builds the extensors — balances the forearm for wrist stability and proper release through impact.'},
    ],
    finisher:'3 × 30s dead hang each arm — towel grip if available. Your grip will never fail on a course again.',
  },
  {
    id:'fri', day:'FRI', label:'Full Body Power', tag:'PEAK OUTPUT', accent:'#f87171',
    focus:'Peak output day. Heavy compounds + max-effort power. This is the session that actually adds yards.',
    warmup:'15 min full body: foam roll, hip mobility, shoulder prep, activation drills. Do not rush this.',
    exercises:[
      {id:'power-clean', name:'Power Clean', sets:5, reps:'3', load:'75–80% 1RM', note:'Triple extension: ankles → knees → hips simultaneously. The most transferable athletic exercise to golf. Fast elbows through. This is swing speed training in a barbell.'},
      {id:'front-sq', name:'Front Squat', sets:4, reps:'5', load:'80% 1RM', note:'Elbows high, upright torso. Builds quad dominance and thoracic mobility critical to maintaining swing posture under load.'},
      {id:'floor-press', name:'Single-Arm DB Floor Press', sets:4, reps:'8 ea', load:'Heavy DB', note:'Core anti-rotates automatically. Single arm presses train the rotational stabilizers — every rep you\'re also doing core work.'},
      {id:'pull-through', name:'Cable Pull-Through', sets:4, reps:'15', load:'Moderate', note:'Hip hinge pattern. Glute squeeze at lockout. Reinforces the hip extension sequencing of the downswing — perfect movement pattern training.'},
      {id:'shrug', name:'Trap Bar Shrug + Hold', sets:3, reps:'10 + 5s hold', load:'Heavy', note:'Upper trap and trap strength for postural endurance. 18 holes is a long time — you need to stay tall through the final round.'},
      {id:'mb-drop', name:'Med Ball Drop Step Slam', sets:4, reps:'5 ea', load:'15–20 lb ball', note:'Step → load → explode. Trains foot-to-hip sequencing of the downswing. Max effort every single rep — no cruise control.'},
      {id:'farmers', name:'Farmer\'s Carry', sets:3, reps:'40 yds', load:'Heavy DBs or trap bar', note:'Walk tall. Crush the handles. Full body strength, conditioning, and grip in one. The perfect finisher movement.'},
    ],
    finisher:'10 min EMOM: odd minutes = 5 power cleans (light), even minutes = 6 box jumps. Stay sharp the whole 10.',
  },
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let state = {
  tab: 'workout',       // 'workout' | 'progress'
  dayIdx: 0,
  progDayIdx: 0,
  weekOffset: 0,
  expandedEx: null,
};

// ── STORAGE ───────────────────────────────────────────────────────────────────
function lsKey(weekOffset, dayId, exId) { return `gl:w${weekOffset}:${dayId}:${exId}`; }
function doneKey(weekOffset, dayId) { return `gl:done:w${weekOffset}:${dayId}`; }
function noteKey(weekOffset, dayId, exId) { return `gl:note:w${weekOffset}:${dayId}:${exId}`; }

function getLog(dayId, exId) {
  try { return JSON.parse(localStorage.getItem(lsKey(state.weekOffset, dayId, exId)) || '{}'); } catch { return {}; }
}
function setLog(dayId, exId, data) {
  localStorage.setItem(lsKey(state.weekOffset, dayId, exId), JSON.stringify(data));
}
function isDone(dayId) {
  return localStorage.getItem(doneKey(state.weekOffset, dayId)) === '1';
}
function toggleDone(dayId) {
  const k = doneKey(state.weekOffset, dayId);
  localStorage.getItem(k) === '1' ? localStorage.removeItem(k) : localStorage.setItem(k, '1');
}
function getNote(dayId, exId) {
  return localStorage.getItem(noteKey(state.weekOffset, dayId, exId)) || '';
}
function setNote(dayId, exId, val) {
  val ? localStorage.setItem(noteKey(state.weekOffset, dayId, exId), val)
      : localStorage.removeItem(noteKey(state.weekOffset, dayId, exId));
}
function getProgressData(dayId, exId) {
  const out = [];
  for (let w = -4; w <= 8; w++) {
    const k = lsKey(w, dayId, exId);
    const raw = localStorage.getItem(k);
    if (raw) {
      try {
        const d = JSON.parse(raw);
        if (d.weight) out.push({ week: w, weight: parseFloat(d.weight) });
      } catch {}
    }
  }
  return out;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function weekLabel() {
  if (state.weekOffset === 0) return 'THIS WEEK';
  if (state.weekOffset > 0) return `WEEK +${state.weekOffset}`;
  return `WEEK ${state.weekOffset}`;
}
function hex2rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  renderHeader();
  renderScrollArea();
  renderBottomNav();
}

function renderHeader() {
  const day = PROGRAM[state.dayIdx];
  const doneCount = PROGRAM.filter(d => isDone(d.id)).length;
  document.getElementById('header').innerHTML = `
    <div class="header-wrap">
      <div class="header-top">
        <div>
          <div class="header-eyebrow">GOLF PERFORMANCE · 5-DAY ADVANCED</div>
          <div class="header-title">Drive.<br><span style="color:${day.accent}">Distance.</span></div>
        </div>
        <div>
          <div style="font-size:9px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;text-align:right">${doneCount}/5 done</div>
          <div class="week-dots">
            ${PROGRAM.map(d => `<div class="week-dot${isDone(d.id)?` done`:''}" style="${isDone(d.id)?`background:${d.accent};border-color:${d.accent};`:''}">
              ${d.day[0]}
            </div>`).join('')}
          </div>
        </div>
      </div>

      <div class="day-nav" id="day-nav">
        ${PROGRAM.map((d,i) => `
          <button class="day-btn${state.dayIdx===i?' active':''}" data-idx="${i}"
            style="${state.dayIdx===i?`--accent-color:${d.accent};`:''}">
            <span class="day-btn-label">${d.day}</span>
            <span class="day-btn-tag">${d.tag}</span>
            ${isDone(d.id)?`<div class="day-done-dot" style="background:${d.accent}"></div>`:''}
          </button>
        `).join('')}
      </div>
    </div>
  `;

  document.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.dayIdx = +btn.dataset.idx;
      state.expandedEx = null;
      render();
      document.getElementById('scroll-area').scrollTop = 0;
    });
  });
}

function renderScrollArea() {
  const el = document.getElementById('scroll-area');
  el.innerHTML = state.tab === 'workout' ? renderWorkout() : renderProgress();
  attachListeners();
}

function renderWorkout() {
  const day = PROGRAM[state.dayIdx];
  const done = isDone(day.id);

  return `
    <div class="content-pad fade-up">
      <!-- Week nav -->
      <div class="week-nav">
        <button class="week-nav-btn" id="week-prev">‹</button>
        <span class="week-nav-label">${weekLabel()}</span>
        <button class="week-nav-btn" id="week-next">›</button>
      </div>

      <!-- Day card -->
      <div class="card" style="border-left:4px solid ${day.accent}">
        <div class="card-header">
          <div class="card-eyebrow" style="color:${day.accent}">${day.tag}</div>
          <div class="card-title">${day.label}</div>
          <div class="card-body">${day.focus}</div>
          <div class="warmup-box">
            <div class="warmup-label">Warm-Up</div>
            <div class="warmup-text">${day.warmup}</div>
          </div>
          <button class="done-btn${done?' completed':''}" id="done-btn"
            style="${done?`background:${day.accent};`:''}">
            ${done ? '✓ SESSION COMPLETE' : 'Mark Session Done'}
          </button>
        </div>
      </div>

      <!-- Exercises -->
      <div style="font-size:9px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin:4px 0 10px;padding:0 2px">
        EXERCISES — TAP TO LOG
      </div>

      ${day.exercises.map((ex, i) => {
        const log = getLog(day.id, ex.id);
        const note = getNote(day.id, ex.id);
        const isOpen = state.expandedEx === i;
        return `
          <div class="ex-card${isOpen?' open':''}" data-ex="${i}"
            style="${isOpen?`--accent-border:${hex2rgba(day.accent,.4)};`:''}">
            <div class="ex-row ex-toggle" data-ex="${i}">
              <div class="ex-num" style="background:${hex2rgba(day.accent,.15)};color:${day.accent}">${i+1}</div>
              <div class="ex-info">
                <div class="ex-name">${ex.name}</div>
                <div class="ex-meta">
                  <span class="ex-sets">${ex.sets} sets × ${ex.reps} · ${ex.load}</span>
                  ${log.weight ? `<span class="ex-logged" style="color:${day.accent}">${log.weight} lbs</span>` : ''}
                </div>
              </div>
              <div class="ex-arrow${isOpen?' open'}">›</div>
            </div>
            ${isOpen ? `
              <div class="ex-body">
                <div class="cue-box" style="border-left:3px solid ${day.accent}">
                  <div class="cue-label" style="color:${day.accent}">Coaching Cue</div>
                  <div class="cue-text">${ex.note}</div>
                </div>
                <div class="log-label">Log — ${weekLabel()}</div>
                <div class="log-grid">
                  <div class="log-field">
                    <label>Weight (lbs)</label>
                    <input type="number" inputmode="decimal" placeholder="e.g. 185"
                      value="${log.weight||''}" data-field="weight" data-ex="${i}" data-day="${day.id}" data-exid="${ex.id}"/>
                  </div>
                  <div class="log-field">
                    <label>Reps Done</label>
                    <input type="number" inputmode="numeric" placeholder="${ex.reps}"
                      value="${log.repsActual||''}" data-field="repsActual" data-ex="${i}" data-day="${day.id}" data-exid="${ex.id}"/>
                  </div>
                  <div class="log-field">
                    <label>Sets Done</label>
                    <input type="number" inputmode="numeric" placeholder="${ex.sets}"
                      value="${log.setsActual||''}" data-field="setsActual" data-ex="${i}" data-day="${day.id}" data-exid="${ex.id}"/>
                  </div>
                  <div class="log-field">
                    <label>RPE (1–10)</label>
                    <input type="number" inputmode="numeric" placeholder="8" min="1" max="10"
                      value="${log.rpe||''}" data-field="rpe" data-ex="${i}" data-day="${day.id}" data-exid="${ex.id}"/>
                  </div>
                </div>
                <div class="notes-field" style="margin-top:2px">
                  <label style="font-size:10px;color:var(--faint);letter-spacing:.15em;text-transform:uppercase;display:block;margin-bottom:4px">Personal Notes</label>
                  <textarea rows="2" placeholder="How did it feel? Any PRs? Adjustments..."
                    data-day="${day.id}" data-exid="${ex.id}">${note}</textarea>

```
            </div>
          </div>
        ` : ''}
      </div>
    `;
  }).join('')}

  <!-- Finisher -->
  <div class="finisher-card" style="border-color:${hex2rgba(day.accent,.4)};background:${hex2rgba(day.accent,.08)}">
    <div class="finisher-label" style="color:${day.accent}">⚡ Finisher</div>
    <div class="finisher-text">${day.finisher}</div>
  </div>

  <div style="height:8px"></div>
</div>
```

`;
}

function renderProgress() {
const day = PROGRAM[state.progDayIdx];

return `<div class="fade-up"> <div style="padding:16px 16px 0"> <div style="font-size:9px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:12px">Select Day</div> </div> <div class="prog-day-scroll"> ${PROGRAM.map((d,i) =>`
<button class="prog-day-btn${state.progDayIdx===i?' active':''}" data-prog="${i}"
style="${state.progDayIdx===i?`background:${d.accent};`:''}">
${d.day} · ${d.label}
</button>
`).join(’’)}
</div>

```
  <div class="content-pad">
    <div style="font-size:9px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-bottom:12px">
      ${day.label.toUpperCase()} — ALL TIME PROGRESS
    </div>
    ${day.exercises.map(ex => {
      const pd = getProgressData(day.id, ex.id);
      const maxW = pd.length ? Math.max(...pd.map(p=>p.weight)) : 0;
      const latest = pd.length ? pd[pd.length-1].weight : null;
      return `
        <div class="prog-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div class="prog-name">${ex.name}</div>
              <div class="prog-sub">${ex.sets} × ${ex.reps} · ${ex.load}</div>
            </div>
            ${latest ? `<div style="text-align:right">
              <div class="prog-pr" style="color:${day.accent}">${latest} lbs</div>
              <div class="prog-pr-label">LATEST</div>
            </div>` : ''}
          </div>
          ${pd.length > 0 ? `
            <div class="prog-bars">
              ${pd.map((p,j) => {
                const pct = maxW > 0 ? p.weight/maxW : 0;
                const isLatest = j === pd.length-1;
                return `<div class="prog-bar-col">
                  <div class="prog-bar-val">${p.weight}</div>
                  <div class="prog-bar" style="height:${Math.max(4,Math.round(pct*52))}px;background:${isLatest?day.accent:hex2rgba(day.accent,.35)}"></div>
                  <div class="prog-bar-week">W${p.week>=0?'+':''}${p.week}</div>
                </div>`;
              }).join('')}
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:8px">
              PR: <span style="color:${day.accent};font-weight:700">${maxW} lbs</span>
              &nbsp;·&nbsp; ${pd.length} session${pd.length!==1?'s':''} logged
            </div>
          ` : `<div class="prog-empty">No data yet — log your first set in the Workout tab</div>`}
        </div>
      `;
    }).join('')}
    <div style="height:8px"></div>
  </div>
</div>
```

`;
}

function renderBottomNav() {
document.getElementById(‘bottom-nav’).innerHTML = `<div class="bnav"> <button class="bnav-btn${state.tab==='workout'?' active':''}" data-tab="workout"> <span class="bnav-icon">🏋️</span> <span class="bnav-label">Workout</span> </button> <button class="bnav-btn${state.tab==='progress'?' active':''}" data-tab="progress"> <span class="bnav-icon">📈</span> <span class="bnav-label">Progress</span> </button> </div>`;
document.querySelectorAll(’.bnav-btn’).forEach(btn => {
btn.addEventListener(‘click’, () => { state.tab = btn.dataset.tab; render(); document.getElementById(‘scroll-area’).scrollTop=0; });
});
}

function attachListeners() {
// Week nav
document.getElementById(‘week-prev’)?.addEventListener(‘click’, () => { state.weekOffset–; state.expandedEx=null; render(); });
document.getElementById(‘week-next’)?.addEventListener(‘click’, () => { state.weekOffset++; state.expandedEx=null; render(); });

// Done btn
document.getElementById(‘done-btn’)?.addEventListener(‘click’, () => {
toggleDone(PROGRAM[state.dayIdx].id); render();
});

// Ex expand
document.querySelectorAll(’.ex-toggle’).forEach(el => {
el.addEventListener(‘click’, e => {
if (e.target.tagName===‘INPUT’||e.target.tagName===‘TEXTAREA’) return;
const idx = +el.dataset.ex;
state.expandedEx = state.expandedEx===idx ? null : idx;
render();
// scroll to expanded card
setTimeout(() => {
const cards = document.querySelectorAll(’.ex-card’);
if (cards[idx]) cards[idx].scrollIntoView({behavior:‘smooth’, block:‘nearest’});
}, 50);
});
});

// Log inputs
document.querySelectorAll(‘input[data-field]’).forEach(input => {
input.addEventListener(‘change’, () => {
const { day: dayId, exid: exId, field } = input.dataset;
const log = getLog(dayId, exId);
log[field] = input.value;
setLog(dayId, exId, log);
// re-render header to update weight badge without closing input
renderHeader();
});
});

// Notes
document.querySelectorAll(‘textarea[data-day]’).forEach(ta => {
ta.addEventListener(‘input’, () => setNote(ta.dataset.day, ta.dataset.exid, ta.value));
});

// Progress day btns
document.querySelectorAll(’.prog-day-btn’).forEach(btn => {
btn.addEventListener(‘click’, () => { state.progDayIdx = +btn.dataset.prog; renderScrollArea(); });
});
}

// ── PWA + SERVICE WORKER ──────────────────────────────────────────────────────
if (‘serviceWorker’ in navigator) {
window.addEventListener(‘load’, () => {
navigator.serviceWorker.register(’./sw.js’).catch(() => {});
});
}

// Show install banner in Safari if not already installed
const isStandalone = window.navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isIOS && !isStandalone) {
document.getElementById(‘install-banner’).style.display = ‘block’;
// Offset scroll area for banner
setTimeout(() => {
const banner = document.getElementById(‘install-banner’);
const h = banner.offsetHeight;
document.getElementById(‘header’).style.marginTop = h + ‘px’;
}, 100);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
render();
</script>

</body>
</html>
